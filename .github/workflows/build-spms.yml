name: Build SPMS TunnelForge PPP Control APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR 11
        uses: actions/checkout@v6
        with:
          repository: NickSimkin/tunnel-forge
          ref: 263ee47dc59dcdb7245dcd80457159e14b76f237

      # ==============================================================
      # IKE / IPsec patches for SPMS
      # ==============================================================

      - name: Apply SPMS IKE compatibility patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/cpp/ikev1.c")
          s = p.read_text()

          # ----------------------------------------------------------
          # 1. Phase 1:
          #    DH14 / MODP2048 -> DH2 / MODP1024
          # ----------------------------------------------------------

          old = "#define IKE_DH_PUBKEY_BYTES 256"
          new = "#define IKE_DH_PUBKEY_BYTES 128"

          assert old in s, "IKE_DH_PUBKEY_BYTES marker not found"
          s = s.replace(old, new, 1)

          old = "extern const uint8_t rfc3526_modp2048_p[256];"
          new = "extern const uint8_t rfc3526_modp2048_p[128];"

          assert old in s, "MODP extern marker not found"
          s = s.replace(old, new, 1)

          dh14 = "0x80, 0x04, 0x00, 0x0e"
          dh2 = "0x80, 0x04, 0x00, 0x02"

          count = s.count(dh14)

          assert count == 2, (
              f"Expected 2 DH14 attributes, found {count}"
          )

          s = s.replace(dh14, dh2)

          # ----------------------------------------------------------
          # 2. Cisco/SPMS RESPONDER-LIFETIME
          #
          # Preserve original Quick Mode SA.
          # DO NOT retransmit QM1.
          # Wait for QM2 belonging to original qm_mid.
          # ----------------------------------------------------------

          start_marker = (
              '  ike_log_isakmp_summary('
              '"Quick Mode reply (msg2)", in, inlen);'
          )

          end_marker = (
              '  if ((in[19] & IKE_FLAG_ENC) == 0 || '
              'util_read_be32(in + 20) != qm_mid) {'
          )

          assert start_marker in s, (
              "Quick Mode start marker not found"
          )

          start = s.index(start_marker)

          assert end_marker in s[start:], (
              "Quick Mode end marker not found"
          )

          end = s.index(end_marker, start)

          replacement = r'''  ike_log_isakmp_summary(
              "Quick Mode reply (msg2)",
              in,
              inlen
          );

          if (in[18] == IKE_EXCH_INFO &&
              (in[19] & IKE_FLAG_ENC)) {

            uint32_t info_mid =
                util_read_be32(in + 20);

            size_t info_enc_len =
                (size_t)inlen - 28;

            int saw_responder_lifetime = 0;
            int saw_other_notify = 0;

            if (info_enc_len >= 8) {

              uint8_t info_plain[256];
              size_t info_plain_len = 0;

              uint8_t info_iv[16];
              uint8_t info_iv_out[16];

              int info_decrypt_ok = -1;

              if (ike->p1_aes) {

                if (info_enc_len >= 16) {

                  qm_first_iv_aes(
                      p1_last_block,
                      info_mid,
                      info_iv
                  );

                  info_decrypt_ok =
                      isakmp_aes128_decrypt(
                          aeskey,
                          info_iv,
                          in + 28,
                          info_enc_len,
                          info_plain,
                          &info_plain_len,
                          info_iv_out
                      );
                }

              } else {

                uint8_t iv8[8];

                qm_first_iv_sha1(
                    p1_last_block,
                    info_mid,
                    iv8
                );

                memcpy(
                    info_iv,
                    iv8,
                    8
                );

                info_decrypt_ok =
                    isakmp_3des_decrypt(
                        deskey,
                        info_iv,
                        in + 28,
                        info_enc_len,
                        info_plain,
                        &info_plain_len,
                        info_iv_out
                    );
              }

              if (info_decrypt_ok == 0) {

                uint8_t info_np = in[16];
                size_t w = 0;

                while (w + 4 <= info_plain_len &&
                       info_np != IKE_PT_NONE) {

                  uint16_t pl =
                      util_read_be16(
                          info_plain + w + 2
                      );

                  if (pl < 4 ||
                      w + pl > info_plain_len) {
                    break;
                  }

                  if (info_np == IKE_PT_NOTIFY &&
                      pl >= 12) {

                    uint16_t ntype =
                        util_read_be16(
                            info_plain +
                            w +
                            4 +
                            6
                        );

                    if (ntype == 24576u) {

                      saw_responder_lifetime = 1;

                      tunnel_engine_log(
                          ANDROID_LOG_INFO,
                          LOG_TAG,
                          "Quick Mode: RESPONDER-LIFETIME received; preserving original SA"
                      );

                    } else {

                      saw_other_notify = 1;

                      tunnel_engine_log(
                          ANDROID_LOG_ERROR,
                          LOG_TAG,
                          "Quick Mode: unexpected NOTIFY type=%u (0x%04x)",
                          (unsigned)ntype,
                          (unsigned)ntype
                      );
                    }
                  }

                  info_np = info_plain[w];
                  w += pl;
                }
              }
            }

            if (!saw_responder_lifetime ||
                saw_other_notify) {

              tunnel_engine_log(
                  ANDROID_LOG_ERROR,
                  LOG_TAG,
                  "Quick Mode: Informational Exchange is not clean RESPONDER-LIFETIME"
              );

              goto fail_fd;
            }

            tunnel_engine_log(
                ANDROID_LOG_INFO,
                LOG_TAG,
                "Quick Mode: waiting for original QM2 without retransmitting QM1"
            );

            int qm_waited_ms = 0;
            int qm2_received = 0;

            while (qm_waited_ms < 20000) {

              if (tunnel_should_stop()) {
                goto fail_fd;
              }

              struct pollfd qmpfd = {
                  .fd = fd,
                  .events = POLLIN
              };

              int qmpr = poll(
                  &qmpfd,
                  1,
                  500
              );

              if (qmpr < 0) {

                if (errno == EINTR) {
                  continue;
                }

                goto fail_fd;
              }

              qm_waited_ms += 500;

              if (qmpr == 0) {
                continue;
              }

              if ((qmpfd.revents & POLLIN) == 0) {
                continue;
              }

              ssize_t qmn = recv(
                  fd,
                  in,
                  sizeof(in),
                  0
              );

              if (qmn <= 0) {
                continue;
              }

              /*
               * NAT-T on UDP/4500:
               *
               * IKE = 00 00 00 00 + ISAKMP
               * ESP = SPI starts immediately
               */
              if (prefix) {

                if (qmn < 4 ||
                    util_read_be32(in) != 0u) {

                  continue;
                }

                memmove(
                    in,
                    in + 4,
                    (size_t)qmn - 4u
                );

                qmn -= 4;
              }

              if (qmn < 28) {
                continue;
              }

              if (in[17] != 0x10) {
                continue;
              }

              uint32_t ike_len =
                  util_read_be32(in + 24);

              if (ike_len != (uint32_t)qmn) {
                continue;
              }

              uint8_t exchange = in[18];
              uint8_t flags = in[19];

              uint32_t message_id =
                  util_read_be32(in + 20);

              /*
               * Additional Informational status:
               * do not replace/restart original SA.
               */
              if (exchange == IKE_EXCH_INFO &&
                  (flags & IKE_FLAG_ENC)) {

                continue;
              }

              /*
               * Accept only encrypted Quick Mode reply
               * belonging to original QM1.
               */
              if (exchange == IKE_EXCH_QUICK &&
                  (flags & IKE_FLAG_ENC) &&
                  message_id == qm_mid) {

                inlen = (int)qmn;
                qm2_received = 1;

                tunnel_engine_log(
                    ANDROID_LOG_INFO,
                    LOG_TAG,
                    "Quick Mode: original QM2 received after RESPONDER-LIFETIME"
                );

                break;
              }
            }

            if (!qm2_received) {

              tunnel_engine_log(
                  ANDROID_LOG_ERROR,
                  LOG_TAG,
                  "Quick Mode: timeout waiting for original QM2"
              );

              goto fail_fd;
            }

            ike_log_isakmp_summary(
                "Quick Mode original msg2 after RESPONDER-LIFETIME",
                in,
                inlen
            );
          }

          '''

          s = s[:start] + replacement + s[end:]

          p.write_text(s)

          # ----------------------------------------------------------
          # 3. RFC 2409 Oakley Group 2 / MODP1024 prime
          # ----------------------------------------------------------

          prime_hex = (
              "FFFFFFFFFFFFFFFFC90FDAA22168C234"
              "C4C6628B80DC1CD129024E088A67CC74"
              "020BBEA63B139B22514A08798E3404DD"
              "EF9519B3CD3A431B302B0A6DF25F1437"
              "4FE1356D6D51C245E485B576625E7EC6"
              "F44C42E9A637ED6B0BFF5CB6F406B7ED"
              "EE386BFB5A899FA5AE9F24117C4B1FE6"
              "49286651ECE65381FFFFFFFFFFFFFFFF"
          )

          prime = bytes.fromhex(prime_hex)

          assert len(prime) == 128

          lines = [
              "#include <stdint.h>",
              "",
              "/* RFC 2409 Oakley Group 2 / MODP1024 */",
              "const uint8_t rfc3526_modp2048_p[128] = {",
          ]

          for i in range(0, 128, 16):

              chunk = ", ".join(
                  f"0x{x:02x}"
                  for x in prime[i:i + 16]
              )

              if i < 112:
                  chunk += ","

              lines.append(
                  "    " + chunk
              )

          lines.append("};")

          Path(
              "android/app/src/main/cpp/modp2048_data.c"
          ).write_text(
              "\n".join(lines) + "\n"
          )

          print(
              "SPMS IKE patches applied: DH2 + preserve SA"
          )
          PY

      # ==============================================================
      # L2TP -> PPP transition patches
      # ==============================================================

      - name: Patch L2TP to PPP transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ----------------------------------------------------------
          # A. l2tp.c
          #
          # Do not blindly consume the first post-ICCN packet.
          # ----------------------------------------------------------

          lp = Path(
              "android/app/src/main/cpp/l2tp.c"
          )

          ls = lp.read_text()

          drain_comment = (
              "  /* Drain stray post-handshake datagram "
              "so data-plane loop does not inherit stale "
              "control noise. */\n"
          )

          if drain_comment in ls:
              ls = ls.replace(
                  drain_comment,
                  "",
                  1
              )

          drain_line = (
              "  (void)recv_plain("
              "esp_fd, esp, NULL, NULL, "
              "in, sizeof(in), 1500);"
          )

          assert drain_line in ls, (
              "post-ICCN recv_plain drain line not found"
          )

          drain_replacement = '''  /*
           * SPMS/Cisco compatibility:
           *
           * Preserve the first post-ICCN datagram.
           * It can contain an L2TP control message that
           * must be acknowledged before PPP proceeds.
           */
          tunnel_engine_log(
              ANDROID_LOG_DEBUG,
              LOG_TAG,
              "l2tp: preserving first post-ICCN packet for PPP/control demux"
          );'''

          ls = ls.replace(
              drain_line,
              drain_replacement,
              1
          )

          lp.write_text(ls)

          # ----------------------------------------------------------
          # B. ppp.c
          #
          # - distinguish IKE from ESP on UDP/4500
          # - process L2TP control while PPP negotiates
          # ----------------------------------------------------------

          pp = Path(
              "android/app/src/main/cpp/ppp.c"
          )

          s = pp.read_text()

          # ----------------------------------------------------------
          # B1. Add helper to recognise IKEv1 datagrams
          # ----------------------------------------------------------

          marker = '''static long long ppp_now_ms(void) {
            struct timeval now;
            gettimeofday(&now, NULL);
            return ((long long)now.tv_sec * 1000ll) + ((long long)now.tv_usec / 1000ll);
          }

          '''

          replacement = '''static long long ppp_now_ms(void) {
            struct timeval now;
            gettimeofday(&now, NULL);
            return ((long long)now.tv_sec * 1000ll) + ((long long)now.tv_usec / 1000ll);
          }

          /*
           * Validate basic IKEv1/ISAKMP framing.
           *
           * UDP/4500 can carry IKE and ESP on the same socket.
           * IKE packets must never be passed to ESP decryption.
           */
          static int ppp_isakmp_datagram_like(
              const uint8_t *p,
              size_t len) {

            if (p == NULL ||
                len < 28u) {

              return 0;
            }

            /*
             * ISAKMP Version:
             * IKEv1 = 0x10
             */
            if (p[17] != 0x10u) {
              return 0;
            }

            uint32_t isakmp_len =
                util_read_be32(
                    p + 24
                );

            if (isakmp_len < 28u) {
              return 0;
            }

            if (isakmp_len !=
                (uint32_t)len) {

              return 0;
            }

            return 1;
          }

          '''

          assert marker in s, (
              "ppp_now_ms marker not found"
          )

          s = s.replace(
              marker,
              replacement,
              1
          )

          # ----------------------------------------------------------
          # B2. recv_ppp needs peer endpoint to ACK control packets
          # ----------------------------------------------------------

          old = '''static int recv_ppp(int esp_fd, esp_keys_t *esp, l2tp_session_t *l2tp, uint8_t *out, size_t cap, int ms) {
          '''

          new = '''static int recv_ppp(
              int esp_fd,
              esp_keys_t *esp,
              const struct sockaddr *peer,
              socklen_t peer_len,
              l2tp_session_t *l2tp,
              uint8_t *out,
              size_t cap,
              int ms) {
          '''

          assert old in s, (
              "recv_ppp signature marker not found"
          )

          s = s.replace(
              old,
              new,
              1
          )

          # ----------------------------------------------------------
          # B3. Filter NAT-T keepalive / IKE BEFORE ESP decrypt
          # ----------------------------------------------------------

          marker = '''    uint8_t plain[4096];
              size_t plen = sizeof(plain);
          '''

          replacement = '''    /*
               * NAT-T keepalive.
               */
              if (esp->udp_encap &&
                  n == 1 &&
                  raw[0] == 0xffu) {

                tunnel_engine_log(
                    ANDROID_LOG_DEBUG,
                    LOG_TAG,
                    "ppp recv: NAT-T keepalive ignored"
                );

                continue;
              }

              /*
               * RFC 3948 non-ESP marker:
               *
               * 00 00 00 00 + IKE
               *
               * Strip/check only for classification.
               * Do not feed the packet to ESP decrypt.
               */
              if (esp->udp_encap &&
                  n >= 32 &&
                  util_read_be32(raw) == 0u &&
                  ppp_isakmp_datagram_like(
                      raw + 4,
                      (size_t)n - 4u)) {

                tunnel_engine_log(
                    ANDROID_LOG_DEBUG,
                    LOG_TAG,
                    "ppp recv: IKE packet on UDP/4500 ignored"
                );

                continue;
              }

              /*
               * Some receive paths can expose ISAKMP without
               * the four-byte non-ESP marker.
               *
               * The old log:
               *
               *   esp decrypt spi mismatch got=377120e8
               *
               * matched the IKE initiator cookie rather than
               * a genuine inbound ESP SPI.
               */
              if (esp->udp_encap &&
                  ppp_isakmp_datagram_like(
                      raw,
                      (size_t)n)) {

                tunnel_engine_log(
                    ANDROID_LOG_DEBUG,
                    LOG_TAG,
                    "ppp recv: bare IKE packet ignored"
                );

                continue;
              }

              uint8_t plain[4096];
              size_t plen = sizeof(plain);
          '''

          assert marker in s, (
              "PPP decrypt insertion marker not found"
          )

          s = s.replace(
              marker,
              replacement,
              1
          )

          # ----------------------------------------------------------
          # B4. Demux L2TP control packets during PPP negotiation
          # ----------------------------------------------------------

          marker = '''    if (plen < 6u) {
              tunnel_engine_log(ANDROID_LOG_WARN, LOG_TAG, "ppp recv short decap plen=%zu", plen);
              continue;
            }
            const uint8_t *ppp_ptr = NULL;
          '''

          replacement = '''    if (plen < 2u) {

              tunnel_engine_log(
                  ANDROID_LOG_WARN,
                  LOG_TAG,
                  "ppp recv short decap plen=%zu",
                  plen
              );

              continue;
            }

            uint16_t l2tp_flags =
                util_read_be16(
                    plain
                );

            /*
             * RFC 2661:
             *
             * T=1 -> L2TP CONTROL packet
             * T=0 -> L2TP DATA / PPP
             *
             * The peer may still send control messages immediately
             * after ICCN. They must be dispatched/ACKed instead of
             * being discarded as "not-ppp-data".
             */
            if ((l2tp_flags &
                 0x8000u) != 0u) {

              int control_rc =
                  l2tp_dispatch_incoming(
                      esp_fd,
                      esp,
                      peer,
                      peer_len,
                      l2tp,
                      plain,
                      plen,
                      NULL,
                      NULL
                  );

              tunnel_engine_log(
                  ANDROID_LOG_DEBUG,
                  LOG_TAG,
                  "ppp recv: processed L2TP control packet flags=0x%04x plen=%zu rc=%d",
                  (unsigned)l2tp_flags,
                  plen,
                  control_rc
              );

              if (control_rc ==
                  L2TP_DISPATCH_REMOTE_CLOSED) {

                tunnel_engine_log(
                    ANDROID_LOG_ERROR,
                    LOG_TAG,
                    "ppp recv: peer closed L2TP session"
                );

                return -1;
              }

              if (control_rc ==
                  L2TP_DISPATCH_ERROR) {

                tunnel_engine_log(
                    ANDROID_LOG_WARN,
                    LOG_TAG,
                    "ppp recv: L2TP control dispatch returned error"
                );
              }

              continue;
            }

            if (plen < 6u) {

              tunnel_engine_log(
                  ANDROID_LOG_WARN,
                  LOG_TAG,
                  "ppp recv short L2TP data plen=%zu",
                  plen
              );

              continue;
            }

            const uint8_t *ppp_ptr = NULL;
          '''

          assert marker in s, (
              "L2TP/PPP demux marker not found"
          )

          s = s.replace(
              marker,
              replacement,
              1
          )

          # ----------------------------------------------------------
          # B5. Update every recv_ppp() call
          # ----------------------------------------------------------

          old_call = (
              "recv_ppp(esp_fd, esp, l2tp,"
          )

          count = s.count(
              old_call
          )

          assert count >= 5, (
              f"Expected multiple recv_ppp calls, found {count}"
          )

          s = s.replace(
              old_call,
              "recv_ppp(esp_fd, esp, peer, peer_len, l2tp,"
          )

          pp.write_text(s)

          print(
              "SPMS L2TP/PPP transition patches applied"
          )
          PY

      # ==============================================================
      # Check patches before spending time compiling
      # ==============================================================

      - name: Verify SPMS patches
        run: |
          echo "===== DH2 ====="

          grep -n \
            "IKE_DH_PUBKEY_BYTES 128" \
            android/app/src/main/cpp/ikev1.c

          echo "===== RESPONDER-LIFETIME ====="

          grep -n \
            "preserving original SA" \
            android/app/src/main/cpp/ikev1.c

          grep -n \
            "original QM2 received" \
            android/app/src/main/cpp/ikev1.c

          echo "===== MODP1024 ====="

          grep -n \
            "rfc3526_modp2048_p\[128\]" \
            android/app/src/main/cpp/modp2048_data.c

          echo "===== POST ICCN ====="

          grep -n \
            "preserving first post-ICCN packet" \
            android/app/src/main/cpp/l2tp.c

          echo "===== IKE FILTER ====="

          grep -n \
            "IKE packet on UDP/4500 ignored" \
            android/app/src/main/cpp/ppp.c

          grep -n \
            "bare IKE packet ignored" \
            android/app/src/main/cpp/ppp.c

          echo "===== L2TP CONTROL DURING PPP ====="

          grep -n \
            "processed L2TP control packet" \
            android/app/src/main/cpp/ppp.c

      # ==============================================================
      # Build environment
      # ==============================================================

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Go dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "Android SDK not found"
            exit 1
          fi

          echo "flutter.sdk=${flutter_root}" > local.properties
          echo "sdk.dir=${android_sdk_root}" >> local.properties

      # ==============================================================
      # Compile APK
      # ==============================================================

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      # ==============================================================
      # Artifact
      # ==============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tunnel-forge-spms-dh2-preserve-sa-ppp-control-v9
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
