name: Build SPMS TunnelForge MSCHAPv2 V19 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR 11
        uses: actions/checkout@v6
        with:
          repository: NickSimkin/tunnel-forge
          ref: 263ee47dc59dcdb7245dcd80457159e14b76f237

      # ==============================================================
      # IKE / IPsec compatibility
      # ==============================================================

      - name: Apply SPMS IKE compatibility patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/cpp/ikev1.c")
          s = p.read_text()

          old = "#define IKE_DH_PUBKEY_BYTES 256"
          assert old in s, "IKE_DH_PUBKEY_BYTES marker not found"

          s = s.replace(
              old,
              "#define IKE_DH_PUBKEY_BYTES 128",
              1
          )

          old = "extern const uint8_t rfc3526_modp2048_p[256];"
          assert old in s, "MODP extern marker not found"

          s = s.replace(
              old,
              "extern const uint8_t rfc3526_modp2048_p[128];",
              1
          )

          dh14 = "0x80, 0x04, 0x00, 0x0e"
          dh2 = "0x80, 0x04, 0x00, 0x02"

          count = s.count(dh14)

          assert count == 2, (
              f"Expected 2 DH14 attributes, found {count}"
          )

          s = s.replace(
              dh14,
              dh2
          )

          start_marker = (
              '  ike_log_isakmp_summary('
              '"Quick Mode reply (msg2)", in, inlen);'
          )

          end_marker = (
              '  if ((in[19] & IKE_FLAG_ENC) == 0 || '
              'util_read_be32(in + 20) != qm_mid) {'
          )

          assert start_marker in s, (
              "Quick Mode start marker not found"
          )

          start = s.index(start_marker)

          assert end_marker in s[start:], (
              "Quick Mode end marker not found"
          )

          end = s.index(
              end_marker,
              start
          )

          replacement = r'''  ike_log_isakmp_summary(
              "Quick Mode reply (msg2)",
              in,
              inlen
          );

          if (in[18] == IKE_EXCH_INFO &&
              (in[19] & IKE_FLAG_ENC)) {

            uint32_t info_mid =
                util_read_be32(in + 20);

            size_t info_enc_len =
                (size_t)inlen - 28;

            int saw_responder_lifetime = 0;
            int saw_other_notify = 0;

            if (info_enc_len >= 8) {

              uint8_t info_plain[256];
              size_t info_plain_len = 0;

              uint8_t info_iv[16];
              uint8_t info_iv_out[16];

              int info_decrypt_ok = -1;

              if (ike->p1_aes) {

                if (info_enc_len >= 16) {

                  qm_first_iv_aes(
                      p1_last_block,
                      info_mid,
                      info_iv
                  );

                  info_decrypt_ok =
                      isakmp_aes128_decrypt(
                          aeskey,
                          info_iv,
                          in + 28,
                          info_enc_len,
                          info_plain,
                          &info_plain_len,
                          info_iv_out
                      );
                }

              } else {

                uint8_t iv8[8];

                qm_first_iv_sha1(
                    p1_last_block,
                    info_mid,
                    iv8
                );

                memcpy(
                    info_iv,
                    iv8,
                    8
                );

                info_decrypt_ok =
                    isakmp_3des_decrypt(
                        deskey,
                        info_iv,
                        in + 28,
                        info_enc_len,
                        info_plain,
                        &info_plain_len,
                        info_iv_out
                    );
              }

              if (info_decrypt_ok == 0) {

                uint8_t info_np = in[16];
                size_t w = 0;

                while (w + 4 <= info_plain_len &&
                       info_np != IKE_PT_NONE) {

                  uint16_t pl =
                      util_read_be16(
                          info_plain + w + 2
                      );

                  if (pl < 4 ||
                      w + pl > info_plain_len) {
                    break;
                  }

                  if (info_np == IKE_PT_NOTIFY &&
                      pl >= 12) {

                    uint16_t ntype =
                        util_read_be16(
                            info_plain +
                            w +
                            4 +
                            6
                        );

                    if (ntype == 24576u) {

                      saw_responder_lifetime = 1;

                      tunnel_engine_log(
                          ANDROID_LOG_INFO,
                          LOG_TAG,
                          "Quick Mode: RESPONDER-LIFETIME received; preserving original SA"
                      );

                    } else {

                      saw_other_notify = 1;

                      tunnel_engine_log(
                          ANDROID_LOG_ERROR,
                          LOG_TAG,
                          "Quick Mode: unexpected NOTIFY type=%u (0x%04x)",
                          (unsigned)ntype,
                          (unsigned)ntype
                      );
                    }
                  }

                  info_np = info_plain[w];
                  w += pl;
                }
              }
            }

            if (!saw_responder_lifetime ||
                saw_other_notify) {

              tunnel_engine_log(
                  ANDROID_LOG_ERROR,
                  LOG_TAG,
                  "Quick Mode: Informational Exchange is not clean RESPONDER-LIFETIME"
              );

              goto fail_fd;
            }

            tunnel_engine_log(
                ANDROID_LOG_INFO,
                LOG_TAG,
                "Quick Mode: waiting for original QM2 without retransmitting QM1"
            );

            int qm_waited_ms = 0;
            int qm2_received = 0;

            while (qm_waited_ms < 20000) {

              if (tunnel_should_stop()) {
                goto fail_fd;
              }

              struct pollfd qmpfd = {
                  .fd = fd,
                  .events = POLLIN
              };

              int qmpr = poll(
                  &qmpfd,
                  1,
                  500
              );

              if (qmpr < 0) {

                if (errno == EINTR) {
                  continue;
                }

                goto fail_fd;
              }

              qm_waited_ms += 500;

              if (qmpr == 0) {
                continue;
              }

              if ((qmpfd.revents & POLLIN) == 0) {
                continue;
              }

              ssize_t qmn = recv(
                  fd,
                  in,
                  sizeof(in),
                  0
              );

              if (qmn <= 0) {
                continue;
              }

              if (prefix) {

                if (qmn < 4 ||
                    util_read_be32(in) != 0u) {

                  continue;
                }

                memmove(
                    in,
                    in + 4,
                    (size_t)qmn - 4u
                );

                qmn -= 4;
              }

              if (qmn < 28) {
                continue;
              }

              if (in[17] != 0x10) {
                continue;
              }

              uint32_t ike_len =
                  util_read_be32(in + 24);

              if (ike_len !=
                  (uint32_t)qmn) {

                continue;
              }

              uint8_t exchange = in[18];
              uint8_t flags = in[19];

              uint32_t message_id =
                  util_read_be32(in + 20);

              if (exchange == IKE_EXCH_INFO &&
                  (flags & IKE_FLAG_ENC)) {

                continue;
              }

              if (exchange == IKE_EXCH_QUICK &&
                  (flags & IKE_FLAG_ENC) &&
                  message_id == qm_mid) {

                inlen = (int)qmn;
                qm2_received = 1;

                tunnel_engine_log(
                    ANDROID_LOG_INFO,
                    LOG_TAG,
                    "Quick Mode: original QM2 received after RESPONDER-LIFETIME"
                );

                break;
              }
            }

            if (!qm2_received) {

              tunnel_engine_log(
                  ANDROID_LOG_ERROR,
                  LOG_TAG,
                  "Quick Mode: timeout waiting for original QM2"
              );

              goto fail_fd;
            }

            ike_log_isakmp_summary(
                "Quick Mode original msg2 after RESPONDER-LIFETIME",
                in,
                inlen
            );
          }

          '''

          s = (
              s[:start] +
              replacement +
              s[end:]
          )

          p.write_text(s)

          prime_hex = (
              "FFFFFFFFFFFFFFFFC90FDAA22168C234"
              "C4C6628B80DC1CD129024E088A67CC74"
              "020BBEA63B139B22514A08798E3404DD"
              "EF9519B3CD3A431B302B0A6DF25F1437"
              "4FE1356D6D51C245E485B576625E7EC6"
              "F44C42E9A637ED6B0BFF5CB6F406B7ED"
              "EE386BFB5A899FA5AE9F24117C4B1FE6"
              "49286651ECE65381FFFFFFFFFFFFFFFF"
          )

          prime = bytes.fromhex(
              prime_hex
          )

          assert len(prime) == 128

          lines = [
              "#include <stdint.h>",
              "",
              "/* RFC 2409 Oakley Group 2 / MODP1024 */",
              "const uint8_t rfc3526_modp2048_p[128] = {",
          ]

          for i in range(
              0,
              128,
              16
          ):

              chunk = ", ".join(
                  f"0x{x:02x}"
                  for x in prime[i:i + 16]
              )

              if i < 112:
                  chunk += ","

              lines.append(
                  "    " + chunk
              )

          lines.append("};")

          Path(
              "android/app/src/main/cpp/modp2048_data.c"
          ).write_text(
              "\n".join(lines) + "\n"
          )

          print(
              "SPMS IKE patches applied successfully"
          )
          PY

      # ==============================================================
      # RFC2661 ICCN mandatory AVPs
      # ==============================================================

      - name: Patch RFC2661 ICCN mandatory AVPs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/cpp/l2tp.c"
          )

          s = p.read_text()

          old = '''  ao = 0;
            avp_u16(avps, &ao, L2TP_AVP_MSG_TYPE, L2TP_MSG_ICCN);
            avp_u16(avps, &ao, L2TP_AVP_ASSIGNED_SESSION, local_sid);
            if (send_ctrl(esp_fd, esp, peer, peer_len, s, avps, ao) != 0)
              return -1;'''

          new = '''  ao = 0;

            /*
             * RFC 2661 section 6.8
             */

            avp_u16(
                avps,
                &ao,
                L2TP_AVP_MSG_TYPE,
                L2TP_MSG_ICCN
            );

            if (l2tp_avp_append_u32(
                    avps,
                    sizeof(avps),
                    &ao,
                    24,
                    10000000u
                ) != 0) {

              return -1;
            }

            if (l2tp_avp_append_u32(
                    avps,
                    sizeof(avps),
                    &ao,
                    19,
                    1u
                ) != 0) {

              return -1;
            }

            tunnel_engine_log(
                ANDROID_LOG_INFO,
                LOG_TAG,
                "l2tp ICCN: RFC2661 mandatory AVPs tx_speed=10000000 framing=sync"
            );

            if (send_ctrl(
                    esp_fd,
                    esp,
                    peer,
                    peer_len,
                    s,
                    avps,
                    ao
                ) != 0) {

              return -1;
            }'''

          count = s.count(old)

          assert count == 1, (
              f"Expected exactly one original ICCN block, found {count}"
          )

          s = s.replace(
              old,
              new,
              1
          )

          p.write_text(s)

          print(
              "RFC2661 ICCN patch applied successfully"
          )
          PY

      # ==============================================================
      # L2TP -> PPP transition
      # ==============================================================

      - name: Patch L2TP to PPP transition
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lp = Path(
              "android/app/src/main/cpp/l2tp.c"
          )

          ls = lp.read_text()

          drain_line = (
              "  (void)recv_plain("
              "esp_fd, esp, NULL, NULL, "
              "in, sizeof(in), 1500);"
          )

          assert drain_line in ls, (
              "post-ICCN recv_plain drain line not found"
          )

          ls = ls.replace(
              drain_line,
              '''  /*
           * SPMS/Cisco compatibility:
           *
           * Preserve first post-ICCN packet.
           * PPP receive will demultiplex L2TP control/data.
           */
          tunnel_engine_log(
              ANDROID_LOG_DEBUG,
              LOG_TAG,
              "l2tp: preserving first post-ICCN packet for PPP/control demux"
          );''',
              1
          )

          lp.write_text(ls)

          pp = Path(
              "android/app/src/main/cpp/ppp.c"
          )

          s = pp.read_text()

          marker = '''static long long ppp_now_ms(void) {
            struct timeval now;
            gettimeofday(&now, NULL);
            return ((long long)now.tv_sec * 1000ll) + ((long long)now.tv_usec / 1000ll);
          }

          '''

          replacement = '''static long long ppp_now_ms(void) {
            struct timeval now;
            gettimeofday(&now, NULL);
            return ((long long)now.tv_sec * 1000ll) + ((long long)now.tv_usec / 1000ll);
          }

          static int ppp_isakmp_datagram_like(
              const uint8_t *p,
              size_t len) {

            if (p == NULL ||
                len < 28u) {

              return 0;
            }

            if (p[17] != 0x10u) {
              return 0;
            }

            uint32_t isakmp_len =
                util_read_be32(
                    p + 24
                );

            if (isakmp_len < 28u) {
              return 0;
            }

            if (isakmp_len !=
                (uint32_t)len) {

              return 0;
            }

            return 1;
          }

          '''

          assert marker in s

          s = s.replace(
              marker,
              replacement,
              1
          )

          old_signature = (
              "static int recv_ppp("
              "int esp_fd, "
              "esp_keys_t *esp, "
              "l2tp_session_t *l2tp, "
              "uint8_t *out, "
              "size_t cap, "
              "int ms) {"
          )

          assert old_signature in s

          new_signature = '''static int recv_ppp(
              int esp_fd,
              esp_keys_t *esp,
              const struct sockaddr *peer,
              socklen_t peer_len,
              l2tp_session_t *l2tp,
              uint8_t *out,
              size_t cap,
              int ms) {'''

          s = s.replace(
              old_signature,
              new_signature,
              1
          )

          recv_start = s.index(
              "static int recv_ppp("
          )

          plain_marker = (
              "    uint8_t plain[4096];"
          )

          plain_pos = s.index(
              plain_marker,
              recv_start
          )

          ike_filter = r'''    if (esp->udp_encap &&
                n == 1 &&
                raw[0] == 0xffu) {

              tunnel_engine_log(
                  ANDROID_LOG_DEBUG,
                  LOG_TAG,
                  "ppp recv: NAT-T keepalive ignored"
              );

              continue;
            }

            if (esp->udp_encap &&
                n >= 32 &&
                util_read_be32(raw) == 0u &&
                ppp_isakmp_datagram_like(
                    raw + 4,
                    (size_t)n - 4u)) {

              tunnel_engine_log(
                  ANDROID_LOG_DEBUG,
                  LOG_TAG,
                  "ppp recv: IKE packet on UDP/4500 ignored"
              );

              continue;
            }

            if (esp->udp_encap &&
                ppp_isakmp_datagram_like(
                    raw,
                    (size_t)n)) {

              tunnel_engine_log(
                  ANDROID_LOG_DEBUG,
                  LOG_TAG,
                  "ppp recv: bare IKE packet ignored"
              );

              continue;
            }

          '''

          s = (
              s[:plain_pos]
              + ike_filter
              + s[plain_pos:]
          )

          recv_start = s.index(
              "static int recv_ppp("
          )

          short_start = s.index(
              "    if (plen < 6u) {",
              recv_start
          )

          ppp_len_marker = (
              "    size_t ppp_len = 0;"
          )

          short_end = s.index(
              ppp_len_marker,
              short_start
          )

          demux = r'''    if (plen < 2u) {

              tunnel_engine_log(
                  ANDROID_LOG_WARN,
                  LOG_TAG,
                  "ppp recv short decap plen=%zu",
                  plen
              );

              continue;
            }

            uint16_t l2tp_flags =
                util_read_be16(
                    plain
                );

            if ((l2tp_flags &
                 0x8000u) != 0u) {

              int control_rc =
                  l2tp_dispatch_incoming(
                      esp_fd,
                      esp,
                      peer,
                      peer_len,
                      l2tp,
                      plain,
                      plen,
                      NULL,
                      NULL
                  );

              tunnel_engine_log(
                  ANDROID_LOG_DEBUG,
                  LOG_TAG,
                  "ppp recv: processed L2TP control packet flags=0x%04x plen=%zu rc=%d",
                  (unsigned)l2tp_flags,
                  plen,
                  control_rc
              );

              if (control_rc ==
                  L2TP_DISPATCH_REMOTE_CLOSED) {

                tunnel_engine_log(
                    ANDROID_LOG_ERROR,
                    LOG_TAG,
                    "ppp recv: peer closed L2TP session"
                );

                return -1;
              }

              continue;
            }

            if (plen < 6u) {
              continue;
            }

            const uint8_t *ppp_ptr = NULL;
          '''

          s = (
              s[:short_start]
              + demux
              + s[short_end:]
          )

          old_call = (
              "recv_ppp("
              "esp_fd, esp, l2tp,"
          )

          count = s.count(
              old_call
          )

          assert count > 0

          s = s.replace(
              old_call,
              "recv_ppp("
              "esp_fd, esp, peer, peer_len, l2tp,"
          )

          pp.write_text(s)

          print(
              f"SPMS L2TP/PPP patch successful; "
              f"updated {count} recv_ppp call sites"
          )
          PY

      # ==============================================================
      # PPP LCP
      # ==============================================================

      - name: Patch PPP LCP MRU rejection handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/cpp/ppp.c"
          )

          s = p.read_text()

          old = '''static int lcp_build_cr(uint8_t *out, size_t cap, uint8_t id, ppp_auth_kind_t auth, uint16_t mru,
                                  int include_address_control, int include_accm, int include_auth) {
          '''

          new = '''static int lcp_build_cr(uint8_t *out, size_t cap, uint8_t id, ppp_auth_kind_t auth, uint16_t mru,
                                  int include_address_control, int include_mru, int include_accm, int include_auth) {
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''  out[o++] = 1;
            out[o++] = 4;
            util_write_be16(out + o, mru);
            o += 2;
            if (include_accm) {
          '''

          new = '''  if (include_mru) {
              out[o++] = 1;
              out[o++] = 4;
              util_write_be16(out + o, mru);
              o += 2;
            }
            if (include_accm) {
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''static void lcp_apply_conf_reject(const uint8_t *lcp, size_t lcp_len, int *include_accm, int *include_auth,
                                            int *removed_accm, int *removed_auth) {
            if (removed_accm != NULL)
              *removed_accm = 0;
          '''

          new = '''static void lcp_apply_conf_reject(const uint8_t *lcp, size_t lcp_len, int *include_mru, int *include_accm,
                                            int *include_auth, int *removed_mru, int *removed_accm, int *removed_auth) {
            if (removed_mru != NULL)
              *removed_mru = 0;
            if (removed_accm != NULL)
              *removed_accm = 0;
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''    if (t == 2u && include_accm != NULL && *include_accm) {
                *include_accm = 0;
                if (removed_accm != NULL)
                  *removed_accm = 1;
              } else if (t == 3u && include_auth != NULL && *include_auth) {
          '''

          new = '''    if (t == 1u && include_mru != NULL && *include_mru) {
                *include_mru = 0;
                if (removed_mru != NULL)
                  *removed_mru = 1;
              } else if (t == 2u && include_accm != NULL && *include_accm) {
                *include_accm = 0;
                if (removed_accm != NULL)
                  *removed_accm = 1;
              } else if (t == 3u && include_auth != NULL && *include_auth) {
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''  int lcp_out_include_ac = 1;
            int lcp_peer_framing_seen = 0;
            int lcp_accm_in_cr = 1;
          '''

          new = '''  int lcp_out_include_ac = 1;
            int lcp_peer_framing_seen = 0;
            int lcp_mru_in_cr = 1;
            int lcp_accm_in_cr = 1;
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = (
              "lcp_build_cr("
              "pkt, sizeof(pkt), id, auth, cr_mru, "
              "1, lcp_accm_in_cr, lcp_auth_in_cr)"
          )

          new = (
              "lcp_build_cr("
              "pkt, sizeof(pkt), id, auth, cr_mru, "
              "1, lcp_mru_in_cr, "
              "lcp_accm_in_cr, lcp_auth_in_cr)"
          )

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = (
              "lcp_build_cr("
              "pkt, sizeof(pkt), id, auth, cr_mru, "
              "lcp_out_include_ac, "
              "lcp_accm_in_cr, lcp_auth_in_cr)"
          )

          new = (
              "lcp_build_cr("
              "pkt, sizeof(pkt), id, auth, cr_mru, "
              "lcp_out_include_ac, "
              "lcp_mru_in_cr, "
              "lcp_accm_in_cr, lcp_auth_in_cr)"
          )

          assert s.count(old) == 3
          s = s.replace(old, new)

          old = '''        int removed_accm = 0;
                  int removed_auth = 0;
                  lcp_apply_conf_reject(p + 2u, (size_t)lcp_len, &lcp_accm_in_cr, &lcp_auth_in_cr, &removed_accm, &removed_auth);
                  if (removed_accm || removed_auth) {
                    tunnel_engine_log(ANDROID_LOG_DEBUG, LOG_TAG,
                                      "ppp lcp: Configure-Reject removed opts accm=%d auth=%d (next CR accm=%d auth=%d)",
                                      removed_accm, removed_auth, lcp_accm_in_cr, lcp_auth_in_cr);
                  }
          '''

          new = '''        int removed_mru = 0;
                  int removed_accm = 0;
                  int removed_auth = 0;

                  lcp_apply_conf_reject(
                      p + 2u,
                      (size_t)lcp_len,
                      &lcp_mru_in_cr,
                      &lcp_accm_in_cr,
                      &lcp_auth_in_cr,
                      &removed_mru,
                      &removed_accm,
                      &removed_auth
                  );

                  if (removed_mru ||
                      removed_accm ||
                      removed_auth) {

                    tunnel_engine_log(
                        ANDROID_LOG_DEBUG,
                        LOG_TAG,
                        "ppp lcp: Configure-Reject removed opts mru=%d accm=%d auth=%d (next CR mru=%d accm=%d auth=%d)",
                        removed_mru,
                        removed_accm,
                        removed_auth,
                        lcp_mru_in_cr,
                        lcp_accm_in_cr,
                        lcp_auth_in_cr
                    );
                  }
          '''

          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          assert (
              "int lcp_mru_in_cr = 1;"
          ) in s

          p.write_text(s)

          print(
              "SPMS PPP LCP patch applied successfully"
          )
          PY

      # ==============================================================
      # MS-CHAPv2 challenge length handling
      # ==============================================================

      - name: Patch MSCHAPv2 challenge length handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/cpp/ppp.c"
          )

          s = p.read_text()

          func_start_marker = (
              "static int ppp_auth_mschapv2("
          )

          func_end_marker = (
              "static int ppp_send_eap("
          )

          assert s.count(func_start_marker) == 1
          assert s.count(func_end_marker) == 1

          func_start = s.index(
              func_start_marker
          )

          func_end = s.index(
              func_end_marker,
              func_start
          )

          fn = s[
              func_start:func_end
          ]

          challenge_start_marker = (
              "    uint8_t chap_id = p[3];"
          )

          challenge_end_marker = (
              "    const uint8_t *auth_chal = p + 7;"
          )

          assert fn.count(
              challenge_start_marker
          ) == 1

          assert fn.count(
              challenge_end_marker
          ) == 1

          challenge_start = fn.index(
              challenge_start_marker
          )

          challenge_end = (
              fn.index(
                  challenge_end_marker,
                  challenge_start
              )
              + len(challenge_end_marker)
          )

          challenge_replacement = '''    uint8_t chap_id = p[3];
            uint16_t plen = util_read_be16(p + 4);

            if (plen < 5u ||
                (size_t)plen + 2u > len) {

              tunnel_engine_log(
                  ANDROID_LOG_WARN,
                  LOG_TAG,
                  "ppp auth: invalid MS-CHAPv2 CHAP length chap_len=%u ppp_len=%zu",
                  (unsigned)plen,
                  len
              );

              continue;
            }

            uint8_t vs = p[6];

            if (vs != 16u ||
                (size_t)plen <
                    5u + (size_t)vs) {

              tunnel_engine_log(
                  ANDROID_LOG_WARN,
                  LOG_TAG,
                  "ppp auth: invalid MS-CHAPv2 challenge chap_len=%u value_size=%u",
                  (unsigned)plen,
                  (unsigned)vs
              );

              continue;
            }

            tunnel_engine_log(
                ANDROID_LOG_DEBUG,
                LOG_TAG,
                "ppp auth: valid MS-CHAPv2 challenge id=%u chap_len=%u value_size=%u",
                (unsigned)chap_id,
                (unsigned)plen,
                (unsigned)vs
            );

            const uint8_t *auth_chal = p + 7;'''

          fn = (
              fn[:challenge_start]
              + challenge_replacement
              + fn[challenge_end:]
          )

          send_marker = (
              "    if (send_ppp("
              "esp_fd, esp, peer, peer_len, "
              "l2tp, out, o) < 0)"
          )

          assert fn.count(send_marker) == 1

          send_pos = fn.index(
              send_marker
          )

          return_marker = (
              "      return -1;"
          )

          return_pos = fn.index(
              return_marker,
              send_pos
          )

          insert_pos = (
              return_pos
              + len(return_marker)
          )

          send_log = '''

            tunnel_engine_log(
                ANDROID_LOG_DEBUG,
                LOG_TAG,
                "ppp auth: MS-CHAPv2 response sent id=%u bytes=%zu",
                (unsigned)chap_id,
                o
            );'''

          fn = (
              fn[:insert_pos]
              + send_log
              + fn[insert_pos:]
          )

          assert (
              "(size_t)plen + 2u > len"
          ) in fn

          assert (
              "5u + (size_t)vs"
          ) in fn

          assert (
              "(size_t)plen < 7u + vs"
          ) not in fn

          s = (
              s[:func_start]
              + fn
              + s[func_end:]
          )

          p.write_text(s)

          print(
              "SPMS MS-CHAPv2 V19 challenge patch applied successfully"
          )
          PY

      # ==============================================================
      # V19 MS-CHAPv2 identity compatibility
      # ==============================================================
      - name: Patch MSCHAPv2 SPMS identity compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/cpp/ppp.c"
          )

          s = p.read_text()

          func_start_marker = (
              "static int ppp_auth_mschapv2("
          )

          func_end_marker = (
              "static int ppp_send_eap("
          )

          assert s.count(func_start_marker) == 1, (
              "Expected exactly one ppp_auth_mschapv2 function"
          )

          assert s.count(func_end_marker) == 1, (
              "Expected exactly one ppp_send_eap marker"
          )

          func_start = s.index(
              func_start_marker
          )

          func_end = s.index(
              func_end_marker,
              func_start
          )

          fn = s[
              func_start:func_end
          ]

          # ==========================================================
          # 1. Insert normalized SPMS identity
          # ==========================================================

          identity_marker = (
              "    uint8_t peer_chal[16];"
          )

          assert fn.count(identity_marker) == 1, (
              "Expected exactly one peer_chal marker"
          )

          identity_code = r'''    /*
             * SPMS identity compatibility.
             *
             * DOMAIN\user -> user
             * user@realm  -> user
             *
             * Username contents are not logged.
             */
            char spms_user[256];

            const char *spms_src =
                user;

            const char *spms_bs =
                strrchr(
                    spms_src,
                    '\\'
                );

            int spms_had_backslash =
                spms_bs != NULL;

            if (spms_bs != NULL) {
              spms_src =
                  spms_bs + 1;
            }

            const char *spms_at =
                strchr(
                    spms_src,
                    '@'
                );

            int spms_had_at =
                spms_at != NULL;

            size_t spms_user_len =
                spms_at != NULL
                    ? (size_t)(
                          spms_at -
                          spms_src
                      )
                    : strlen(
                          spms_src
                      );

            if (spms_user_len == 0u ||
                spms_user_len >=
                    sizeof(spms_user)) {

              tunnel_engine_log(
                  ANDROID_LOG_ERROR,
                  LOG_TAG,
                  "ppp auth: SPMS identity normalization failed original_len=%zu effective_len=%zu",
                  strlen(user),
                  spms_user_len
              );

              return -1;
            }

            memcpy(
                spms_user,
                spms_src,
                spms_user_len
            );

            spms_user[
                spms_user_len
            ] = '\0';

            int spms_changed =
                strcmp(
                    spms_user,
                    user
                ) != 0;

            tunnel_engine_log(
                ANDROID_LOG_INFO,
                LOG_TAG,
                "ppp auth: SPMS identity mode=local-account original_len=%zu effective_len=%zu stripped_domain=%d stripped_realm=%d changed=%d",
                strlen(user),
                spms_user_len,
                spms_had_backslash,
                spms_had_at,
                spms_changed
            );

          '''

          fn = fn.replace(
              identity_marker,
              identity_code +
              identity_marker,
              1
          )

          # ==========================================================
          # 2. Use normalized identity in ChallengeHash calculation
          # ==========================================================

          old_response_call = (
              "    if (ppp_mschapv2_response_value("
              "user, password, auth_chal, "
              "peer_chal, val49) != 0)"
          )

          new_response_call = (
              "    if (ppp_mschapv2_response_value("
              "spms_user, password, auth_chal, "
              "peer_chal, val49) != 0)"
          )

          assert fn.count(
              old_response_call
          ) == 1, (
              "MS-CHAPv2 response calculation marker mismatch"
          )

          fn = fn.replace(
              old_response_call,
              new_response_call,
              1
          )

          # ==========================================================
          # 3. Replace CHAP Response Name block POSITIONALLY
          #
          # No multiline exact matching.
          # ==========================================================

          name_start_marker = (
              "    size_t ulen = strlen(user);"
          )

          name_end_marker = (
              "    o += ulen;"
          )

          assert fn.count(
              name_start_marker
          ) == 1, (
              "Expected exactly one username block start"
          )

          assert fn.count(
              name_end_marker
          ) == 1, (
              "Expected exactly one username block end"
          )

          name_start = fn.index(
              name_start_marker
          )

          name_end = (
              fn.index(
                  name_end_marker,
                  name_start
              )
              + len(name_end_marker)
          )

          name_replacement = (
              "    size_t ulen = strlen(spms_user);\n"
              "\n"
              "    if (o + ulen > sizeof(out)) {\n"
              "      tunnel_engine_log(\n"
              "          ANDROID_LOG_ERROR,\n"
              "          LOG_TAG,\n"
              "          \"ppp auth: MS-CHAPv2 response username too long effective_len=%zu\",\n"
              "          ulen\n"
              "      );\n"
              "      return -1;\n"
              "    }\n"
              "\n"
              "    memcpy(\n"
              "        out + o,\n"
              "        spms_user,\n"
              "        ulen\n"
              "    );\n"
              "\n"
              "    o += ulen;"
          )

          fn = (
              fn[:name_start]
              + name_replacement
              + fn[name_end:]
          )

          # ==========================================================
          # 4. Hard verification
          # ==========================================================

          assert (
              "identity mode=local-account"
          ) in fn

          assert (
              "ppp_mschapv2_response_value("
              "spms_user, password"
          ) in fn

          assert (
              "size_t ulen = strlen(spms_user);"
          ) in fn

          assert (
              "size_t ulen = strlen(user);"
          ) not in fn

          s = (
              s[:func_start]
              + fn
              + s[func_end:]
          )

          p.write_text(s)

          print(
              "SPMS MS-CHAPv2 V20 identity compatibility applied successfully"
          )
          PY
      # ==============================================================
      # V19 Failure diagnostic
      # ==============================================================

      - name: Add MSCHAPv2 failure diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/cpp/ppp.c"
          )

          s = p.read_text()

          func_start_marker = (
              "static int ppp_auth_mschapv2("
          )

          func_end_marker = (
              "static int ppp_send_eap("
          )

          assert s.count(func_start_marker) == 1
          assert s.count(func_end_marker) == 1

          func_start = s.index(
              func_start_marker
          )

          func_end = s.index(
              func_end_marker,
              func_start
          )

          fn = s[
              func_start:func_end
          ]

          marker = (
              "        ppp_mschapv2_failure_info_t failure;"
          )

          count = fn.count(
              marker
          )

          assert count == 1, (
              f"Expected exactly one MS-CHAPv2 failure "
              f"structure marker, found {count}"
          )

          diagnostic = r'''        /*
                 * V19 diagnostic only.
                 *
                 * No password, NT hash, PeerChallenge or NT-Response
                 * is logged.
                 */
                size_t failure_available =
                    len > 6u
                        ? len - 6u
                        : 0u;

                size_t failure_declared =
                    chap_len >= 4u
                        ? (size_t)chap_len - 4u
                        : 0u;

                size_t failure_msg_len =
                    failure_declared < failure_available
                        ? failure_declared
                        : failure_available;

                const uint8_t *failure_msg =
                    failure_msg_len > 0u
                        ? p + 6
                        : NULL;

                size_t dump_len =
                    failure_msg_len > 64u
                        ? 64u
                        : failure_msg_len;

                char failure_ascii[65];
                char failure_hex[193];

                size_t hpos = 0u;

                for (size_t k = 0u;
                     k < dump_len;
                     k++) {

                  uint8_t c =
                      failure_msg[k];

                  failure_ascii[k] =
                      (c >= 32u &&
                       c <= 126u)
                          ? (char)c
                          : '.';

                  if (hpos <
                      sizeof(failure_hex) - 1u) {

                    int written =
                        snprintf(
                            failure_hex + hpos,
                            sizeof(failure_hex) - hpos,
                            k + 1u < dump_len
                                ? "%02x "
                                : "%02x",
                            (unsigned)c
                        );

                    if (written < 0) {
                      hpos = 0u;
                      break;
                    }

                    if ((size_t)written >=
                        sizeof(failure_hex) - hpos) {

                      hpos =
                          sizeof(failure_hex) - 1u;

                      break;
                    }

                    hpos +=
                        (size_t)written;
                  }
                }

                failure_ascii[dump_len] = '\0';
                failure_hex[hpos] = '\0';

                ppp_log_rx_summary(
                    p,
                    len,
                    "auth-mschapv2-failure"
                );

                tunnel_engine_log(
                    ANDROID_LOG_ERROR,
                    LOG_TAG,
                    "ppp auth: raw MS-CHAPv2 failure id=%u chap_len=%u frame_len=%zu declared_msg_len=%zu available_msg_len=%zu dump_len=%zu ascii=\"%s\" hex=%s",
                    (unsigned)p[3],
                    (unsigned)chap_len,
                    len,
                    failure_declared,
                    failure_available,
                    dump_len,
                    failure_ascii,
                    failure_hex
                );

          '''

          fn = fn.replace(
              marker,
              diagnostic + marker,
              1
          )

          assert (
              "raw MS-CHAPv2 failure"
          ) in fn

          s = (
              s[:func_start]
              + fn
              + s[func_end:]
          )

          p.write_text(s)

          print(
              "SPMS MS-CHAPv2 V19 failure diagnostics applied successfully"
          )
          PY

      # ==============================================================
      # Build environment
      # ==============================================================

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Go dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "Android SDK not found"
            exit 1
          fi

          echo "flutter.sdk=${flutter_root}" > local.properties
          echo "sdk.dir=${android_sdk_root}" >> local.properties

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          set -euo pipefail

          test -f \
            build/app/outputs/flutter-apk/app-debug.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: tunnel-forge-spms-dh2-iccn-lcp-mschapv2-identity-v19
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
