name: Build SPMS TunnelForge DH2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout PR 11
        uses: actions/checkout@v6
        with:
          repository: NickSimkin/tunnel-forge
          ref: 263ee47dc59dcdb7245dcd80457159e14b76f237

      - name: Patch IKEv1 to DH2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ike = Path("android/app/src/main/cpp/ikev1.c")
          s = ike.read_text()

          assert "#define IKE_DH_PUBKEY_BYTES 256" in s
          s = s.replace(
              "#define IKE_DH_PUBKEY_BYTES 256",
              "#define IKE_DH_PUBKEY_BYTES 128",
              1
          )

          assert "extern const uint8_t rfc3526_modp2048_p[256];" in s
          s = s.replace(
              "extern const uint8_t rfc3526_modp2048_p[256];",
              "extern const uint8_t rfc3526_modp2048_p[128];",
              1
          )

          dh14 = "0x80, 0x04, 0x00, 0x0e"
          assert s.count(dh14) == 2
          s = s.replace(
              dh14,
              "0x80, 0x04, 0x00, 0x02"
          )

          ike.write_text(s)

          prime_hex = (
              "FFFFFFFFFFFFFFFFC90FDAA22168C234"
              "C4C6628B80DC1CD129024E088A67CC74"
              "020BBEA63B139B22514A08798E3404DD"
              "EF9519B3CD3A431B302B0A6DF25F1437"
              "4FE1356D6D51C245E485B576625E7EC6"
              "F44C42E9A637ED6B0BFF5CB6F406B7ED"
              "EE386BFB5A899FA5AE9F24117C4B1FE6"
              "49286651ECE65381FFFFFFFFFFFFFFFF"
          )

          prime = bytes.fromhex(prime_hex)
          assert len(prime) == 128

          lines = [
              "#include <stdint.h>",
              "",
              "/* RFC 2409 Oakley Group 2 / MODP1024 */",
              "const uint8_t rfc3526_modp2048_p[128] = {",
          ]

          for i in range(0, 128, 16):
              chunk = ", ".join(
                  f"0x{x:02x}" for x in prime[i:i + 16]
              )

              if i < 112:
                  chunk += ","

              lines.append("    " + chunk)

          lines.append("};")

          Path(
              "android/app/src/main/cpp/modp2048_data.c"
          ).write_text(
              "\n".join(lines) + "\n"
          )

          print("SPMS DH2 patch applied")
          PY

